# Add Chulane's knowledge tools to the selected DeepSeek Harness profile.
- insert:
    - id: chulane-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chulane
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.env.CHULANE_MCP_ENTRY
        # Pass just the connection selected for this MCP process.
        env: !!js >-
          Object.fromEntries(Object.entries(process.env).filter(([key]) =>
            key === 'CHULANE_PROFILE' || ['URL', 'ACCESS_KEY', 'USERNAME', 'PASSWORD', 'WORKSPACE'].some(field =>
              key === (process.env.CHULANE_PROFILE ? 'CHULANE_PROFILE_' + process.env.CHULANE_PROFILE.toUpperCase() + '_' : 'CHULANE_') + field)))
