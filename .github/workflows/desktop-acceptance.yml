name: Native desktop acceptance

on: workflow_dispatch

permissions:
  contents: read

jobs:
  installed-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/chulane-poc
    steps:
      - name: Preserve patch line endings and enable long paths on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm exec playwright install chromium
      - name: Locate the NSIS compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command makensis -ErrorAction SilentlyContinue)) {
            $dir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
            if (!(Test-Path "$dir\makensis.exe")) {
              choco install nsis --yes --no-progress
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            if (!(Test-Path "$dir\makensis.exe")) { throw 'NSIS compiler missing.' }
            $dir >> $env:GITHUB_PATH
          }
      - run: pnpm package:${{ matrix.target }}
      - name: Install, exercise, and uninstall the Windows package
        if: runner.os == 'Windows'
        run: pnpm smoke:windows dist-host/chulane-setup-x64.exe
      - name: Exercise the native Windows agent launcher
        if: runner.os == 'Windows'
        run: pnpm exec tsx --test tests/integration/local-agent.test.ts
      - name: Verify the signed macOS bundle and exercise the installed app
        if: runner.os == 'macOS'
        run: pnpm smoke:macos "dist-host/chulane-macos-$(node -p process.arch).zip"
